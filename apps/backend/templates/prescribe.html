<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Prescription</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-role="clinic">
<main>
<div class="wrap narrow">

  <div class="orgband clinic">
    <div class="ico">&#127973;</div>
    <div>
      <div class="nm">Grace Medical Centre</div>
      <div class="sub">Prescriber portal &middot; Dr Maximum Alex</div>
    </div>
  </div>

  <h1>New prescription</h1>
  <p class="lede">Issue a prescription. The patient takes the code to any pharmacy on the network.</p>

  <div id="form-view">
    <div class="card">
      <h2>Patient</h2>
      <div class="field">
        <label>Search by name</label>
        <input id="patient-q" placeholder="Start typing a patient name…" autocomplete="off">
      </div>
      <div class="field">
        <label>Patient</label>
        <select id="patient"><option value="">— select a patient —</option></select>
      </div>
    </div>

    <div class="card">
      <h2>Medication</h2>
      <div id="items"></div>
      <button class="ghost" id="add-item" type="button">+ Add another medication</button>
      <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
                  display:flex;justify-content:space-between;align-items:center">
        <span class="muted">Estimated total</span>
        <span id="total" style="font-size:22px;font-weight:700">&#8358;0</span>
      </div>
    </div>

    <div id="err"></div>
    <button class="wide" id="submit">Issue prescription &amp; generate code</button>
  </div>

  <div id="done-view" class="hide">
    <div class="codebox">
      <div class="cap">Dispensing code</div>
      <div class="code" id="out-code">––––––––</div>
      <div class="exp" id="out-exp"></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px">
        <div>
          <div class="muted small">Patient</div>
          <div style="font-weight:600" id="out-patient"></div>
        </div>
        <div class="right">
          <div class="muted small">Issued by</div>
          <div style="font-weight:600" id="out-prescriber"></div>
          <div class="small" style="color:var(--clinic)" id="out-org"></div>
        </div>
      </div>
      <table>
        <thead><tr><th>Medication</th><th>Regimen</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead>
        <tbody id="out-items"></tbody>
      </table>
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
                  display:flex;justify-content:space-between">
        <span class="muted">Total</span>
        <span style="font-weight:700;font-size:18px" id="out-total"></span>
      </div>
    </div>

    <div class="row">
      <button class="ghost" id="again">Issue another</button>
      <button onclick="location.href='/pharmacy'">Go to pharmacy &rarr;</button>
    </div>
  </div>

</div>
</main>
<script src="/static/js/api.js"></script>
<script src="/static/js/layout.js"></script>
<script src="/static/js/prescribe.js"></script>
</body>
</html>
